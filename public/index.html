<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111214">

    <title>Murphy | Discord Community</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    rgba(8, 10, 25, 0.35),
                    rgba(8, 10, 25, 0.55)
                ),
                url("clouds.png") center center / cover no-repeat fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Judul website */
.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 5px;
    margin-bottom: 16px;

    background: linear-gradient(
        90deg,
        #818cf8 0%,
        #ffffff 25%,
        #c4b5fd 50%,
        #ffffff 75%,
        #818cf8 100%
    );

    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: shimmer 7s linear infinite;

    filter: drop-shadow(0 0 8px rgba(165, 180, 252, 0.35));
}

@keyframes shimmer {
    0% {
        background-position: 200% center;
    }

    100% {
        background-position: -200% center;
    }
}

        /* Gambar logo server */
        .server-logo {
            display: block;
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 16px;
            border: 2px solid rgba(196, 181, 253, 0.5);
            box-shadow: 0 5px 25px rgba(88, 101, 242, 0.25);
        }

        .subtitle {
            color: #c1c3d3;
            line-height: 1.8;
        }

        /* Kartu utama */
        .server-card {
            margin-top: 32px;
            padding: 32px;
            background: rgba(23, 25, 35, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 22px;
            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .server-card h2 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #f3f4f6;
        }

        /* Informasi jumlah member */
        .member-card {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 350px;
            margin: 26px auto 0;
            padding: 22px;
            text-align: left;
            background: linear-gradient(
                135deg,
                rgba(88, 101, 242, 0.12),
                rgba(139, 92, 246, 0.06)
            );
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 16px;
            transition: border-color 0.25s, transform 0.25s;
        }

        .member-card:hover {
            transform: translateY(-3px);
            border-color: rgba(129, 140, 248, 0.5);
        }

        .member-icon {
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #5865f2, #8b5cf6);
            border-radius: 14px;
            font-size: 24px;
            box-shadow: 0 5px 25px rgba(88, 101, 242, 0.25);
        }

        .member-card p {
            color: #c1c3d3;
            font-size: 14px;
        }

        .member-card h3 {
            margin-top: 5px;
            font-size: 28px;
            color: #ffffff;
        }

        /* Discord widget */
        .widget {
            margin: 28px auto 0;
            width: 100%;
            max-width: 350px;
            overflow: hidden;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.12);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        iframe {
            display: block;
            width: 100%;
            height: 500px;
            border: none;
            background: #2b2d31;
        }

        /* Footer */
        .footer {
            margin-top: 26px;
            font-size: 12px;
            color: #d0d1df;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
        }

        /* Tampilan HP */
        @media (max-width: 480px) {
            body {
                padding: 18px 14px;
                background-attachment: scroll;
            }

            .logo {
                font-size: 25px;
                letter-spacing: 3px;
                margin-bottom: 14px;
            }

            .server-logo {
                width: 55px;
                height: 55px;
                margin-bottom: 14px;
            }

            .subtitle {
                font-size: 14px;
                line-height: 1.7;
            }

            .server-card {
                margin-top: 26px;
                padding: 22px 16px;
                border-radius: 18px;
            }

            .server-card h2 {
                font-size: 20px;
            }

            .member-card {
                padding: 18px;
                gap: 12px;
            }

            .member-icon {
                width: 44px;
                height: 44px;
                font-size: 21px;
            }

            .member-card h3 {
                font-size: 25px;
            }

            iframe {
                height: 450px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .member-card {
                transition: none;
            }

            .member-card:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header>
            <h1 class="logo">MURPHY COMMUNITY</h1>

            <img
                src="murphy.png"
                alt="Murphy Logo"
                class="server-logo"
            >

            <p class="subtitle">
                Welcome to our community.<br>
                Join us and connect with everyone!
            </p>
        </header>

        <section class="server-card">
            <h2>Discord Community</h2>

            <p class="subtitle">
                Connect with the Murphy community on Discord.
            </p>

            <div class="member-card">
                <div class="member-icon">♟</div>

                <div>
                    <p>Total Members</p>
                    <h3 id="member-count">Memuat...</h3>
                </div>
            </div>

            <div class="widget">
                <iframe
                    src="https://discord.com/widget?id=1536009463582949396&theme=dark"
                    title="Murphy Discord Server Widget"
                    loading="lazy"
                    allowtransparency="true"
                    sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
                </iframe>
            </div>
        </section>

        <footer class="footer">
            &copy; 2026 Murphy Community
        </footer>

    </main>

    <script>
        async function updateMemberCount() {
            const countElement = document.getElementById("member-count");

            try {
                const response = await fetch("/api/member-count");

                if (!response.ok) {
                    throw new Error("Gagal mengambil jumlah member");
                }

                const data = await response.json();

                countElement.textContent =
                    data.memberCount?.toLocaleString("id-ID")
                    ?? "Tidak tersedia";

            } catch (error) {
                countElement.textContent = "Tidak tersedia";
                console.error("Gagal mengambil jumlah member:", error);
            }
        }

        updateMemberCount();

        // Perbarui jumlah member setiap 5 menit
        setInterval(updateMemberCount, 300000);
    </script>
</body>
</html>
